name: Instagram post

# Daily 08:47 IST: posts today's services reel or carousel from social/ig/queue/ to Instagram (+ a Facebook Page copy).
# Daily 13:17 IST: posts today's midday reel/carousel from social/ig/midday/ (owner 16 Nov: 3 posts a day).
# Daily 18:47 IST: posts today's image post from social/ig/images/ (PNG pre-rendered by card.js in social/ig/media/<id>/).
# Reels are rendered here (voice + music), uploaded to a release so Meta can fetch them, then posted (see ig.js).
# Pause any time: repo variable IG_AUTO_POST = off. Facebook copy off: repo variable FB_COPY = off.

on:
  schedule:
    - cron: "17 3 * * *"   # 08:47 IST (off the busy :00/:30 slots, which GitHub sometimes skips)
    - cron: "47 5 * * *"   # 11:17 IST catch-up if GitHub skipped the first run; posted files are moved, so nothing posts twice
    - cron: "47 7 * * *"   # 13:17 IST daily midday reel/carousel
    - cron: "17 9 * * *"   # 14:47 IST midday catch-up
    - cron: "17 13 * * *"  # 18:47 IST daily image post
    - cron: "47 14 * * *"  # 20:17 IST image catch-up
  workflow_dispatch:
    inputs:
      date:
        description: "Queue date YYYY-MM-DD (blank = today in IST)"
        default: ""
      queue:
        description: "Which post: reel (morning queue), midday (midday queue) or image (evening queue)"
        type: choice
        options: [reel, midday, image]
        default: reel
      dry_run:
        description: "Dry run: render + check everything, post nothing"
        type: boolean
        default: true
      look:
        description: "Force a design for a test (midnight, notebook, block, phone, neon, footage); blank = automatic"
        default: ""

permissions:
  contents: write

concurrency:
  group: ig-post

jobs:
  post:
    if: vars.IG_AUTO_POST != 'off' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      MUSIC: "on"
      TTS_ENGINE: edge
      META_TOKEN: ${{ secrets.META_TOKEN }}
      META_PAGE_ID: ${{ vars.META_PAGE_ID }}
      META_IG_ID: ${{ vars.META_IG_ID }}
      FB_COPY: ${{ vars.FB_COPY }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      DATE_IN: ${{ inputs.date }}
      IG_QUEUE: ${{ (github.event.schedule == '17 13 * * *' || github.event.schedule == '47 14 * * *' || inputs.queue == 'image') && 'social/ig/images' || ((github.event.schedule == '47 7 * * *' || github.event.schedule == '17 9 * * *' || inputs.queue == 'midday') && 'social/ig/midday' || 'social/ig/queue') }}
      LOOK: ${{ inputs.look }}
    steps:
      - uses: actions/checkout@v4
        with: # scheduled runs take the latest main, so a catch-up run sees what the first run already posted
          ref: ${{ github.event_name == 'schedule' && 'main' || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: What is due
        id: due
        run: |
          # GitHub sometimes runs a scheduled job 10+ hours late (17 Nov: midday post went out at 00:04 IST, image at
          # 03:14 IST). A scheduled run only posts inside its slot's window (IST); outside it, it skips and the
          # external trigger / next run posts. Manual runs always post.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            M=$(( 10#$(TZ=Asia/Kolkata date +%H) * 60 + 10#$(TZ=Asia/Kolkata date +%M) ))
            case "$IG_QUEUE" in
              social/ig/queue)  LO=480;  HI=750 ;;   # 08:00-12:30
              social/ig/midday) LO=750;  HI=1020 ;;  # 12:30-17:00
              *)                LO=1080; HI=1350 ;;  # 18:00-22:30
            esac
            if [ $M -lt $LO ] || [ $M -ge $HI ]; then
              echo "::warning::Scheduled run fired at $(TZ=Asia/Kolkata date +%H:%M) IST, outside this slot's window; skipped."
              echo "kind=none" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          OUT=$(node ig.js kind "$DATE_IN")
          echo "$OUT"
          echo "kind=${OUT%% *}" >> "$GITHUB_OUTPUT"
          echo "file=${OUT#* }" >> "$GITHUB_OUTPUT"

      - name: Install ffmpeg, Playwright, Chromium and edge-tts
        if: steps.due.outputs.kind == 'reel'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          python3 -m pip install -q edge-tts

      - name: Render reel and upload to a release
        id: rel
        if: steps.due.outputs.kind == 'reel'
        env:
          DUE_FILE: ${{ steps.due.outputs.file }}
        run: |
          F="$DUE_FILE"
          ID=$(node -p "require('./$F').id")
          node render.js "$F"
          cp "out/$ID/cover.png" "out/$ID/$ID-cover.png"
          TAG="ig-$ID"
          gh release view "$TAG" >/dev/null 2>&1 && gh release upload "$TAG" "out/$ID/$ID.mp4" "out/$ID/$ID-cover.png" --clobber \
            || gh release create "$TAG" "out/$ID/$ID.mp4" "out/$ID/$ID-cover.png" --title "IG reel: $ID" --notes "Instagram services reel (auto)."
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Post to Instagram (+ Facebook copy)
        if: steps.due.outputs.kind != 'none'
        env:
          RELEASE_TAG: ${{ steps.rel.outputs.tag }}
        run: node ig.js post "$DATE_IN"

      - name: Save queue state
        if: steps.due.outputs.kind != 'none' && env.DRY_RUN != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A social/ig
          git diff --cached --quiet || git commit -m "Instagram: posted $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done

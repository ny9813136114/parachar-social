name: Instagram post

# 08:47 IST: posts today's services reel or carousel from social/ig/queue/ to Instagram (+ a Facebook Page copy).
# 13:17 IST: posts today's midday reel/carousel from social/ig/midday/ (owner 16 Nov: 3 posts a day).
# 18:47 IST: posts today's image post from social/ig/images/ (PNG pre-rendered by card.js in social/ig/media/<id>/).
# Reels are rendered here (voice + music), uploaded to a release so Meta can fetch them, then posted (see ig.js).
# Pause any time: repo variable IG_AUTO_POST = off. Facebook copy off: repo variable FB_COPY = off.

on:
  schedule:
    # GitHub runs scheduled jobs late or skips them (17-20 Nov: runs at 3-4 AM IST, slots missed). So the job is
    # started every 30 min and each run works out what is due: morning from 08:47, midday from 13:17, image from
    # 18:47 IST; a slot missed earlier is caught up later the same day. At most one post per run, 75+ min apart,
    # and nothing before 08:00 or after 22:30 IST. Posted files are moved, so nothing posts twice.
    - cron: "17 * * * *"
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Queue date YYYY-MM-DD (blank = today in IST)"
        default: ""
      queue:
        description: "Which post: reel (morning queue), midday (midday queue) or image (evening queue)"
        type: choice
        options: [reel, midday, image]
        default: reel
      dry_run:
        description: "Dry run: render + check everything, post nothing"
        type: boolean
        default: true
      look:
        description: "Force a design for a test (midnight, notebook, block, phone, neon, footage); blank = automatic"
        default: ""

permissions:
  contents: write

concurrency:
  group: ig-post

jobs:
  post:
    if: vars.IG_AUTO_POST != 'off' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      MUSIC: "on"
      TTS_ENGINE: edge
      META_TOKEN: ${{ secrets.META_TOKEN }}
      META_PAGE_ID: ${{ vars.META_PAGE_ID }}
      META_IG_ID: ${{ vars.META_IG_ID }}
      FB_COPY: ${{ vars.FB_COPY }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      DATE_IN: ${{ inputs.date }}
      QUEUE_IN: ${{ inputs.queue }}
      LOOK: ${{ inputs.look }}
    steps:
      - uses: actions/checkout@v4
        with: # scheduled runs take the latest main, so a catch-up run sees what the first run already posted
          ref: ${{ github.event_name == 'schedule' && 'main' || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: What is due
        id: due
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            M=$(( 10#$(TZ=Asia/Kolkata date +%H) * 60 + 10#$(TZ=Asia/Kolkata date +%M) )); D=$(TZ=Asia/Kolkata date +%F)
            if [ $M -lt 480 ] || [ $M -ge 1350 ]; then echo "Outside 08:00-22:30 IST; nothing posted."; echo "kind=none" >> "$GITHUB_OUTPUT"; exit 0; fi
            AGO=$(node -e "const l=require('./social/ig/published/log.json');const t=Object.values(l).filter(r=>r.at).map(r=>Date.parse(r.at));console.log(t.length?Math.round((Date.now()-Math.max(...t))/60000):9999)")
            if [ "$AGO" -lt 75 ]; then echo "Last post $AGO min ago; waiting for the next run."; echo "kind=none" >> "$GITHUB_OUTPUT"; exit 0; fi
            IG_QUEUE=""
            for S in "social/ig/queue 527" "social/ig/midday 797" "social/ig/images 1127"; do
              set -- $S
              if [ $M -ge $2 ] && ls "$1/$D"-*.json >/dev/null 2>&1; then IG_QUEUE=$1; break; fi
            done
            [ -z "$IG_QUEUE" ] && { echo "Nothing due."; echo "kind=none" >> "$GITHUB_OUTPUT"; exit 0; }
          else
            case "$QUEUE_IN" in image) IG_QUEUE=social/ig/images ;; midday) IG_QUEUE=social/ig/midday ;; *) IG_QUEUE=social/ig/queue ;; esac
          fi
          echo "IG_QUEUE=$IG_QUEUE" >> "$GITHUB_ENV"; export IG_QUEUE; echo "Queue: $IG_QUEUE"
          OUT=$(node ig.js kind "$DATE_IN")
          echo "$OUT"
          echo "kind=${OUT%% *}" >> "$GITHUB_OUTPUT"
          echo "file=${OUT#* }" >> "$GITHUB_OUTPUT"

      - name: Install ffmpeg, Playwright, Chromium and edge-tts
        if: steps.due.outputs.kind == 'reel'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          python3 -m pip install -q edge-tts

      - name: Render reel and upload to a release
        id: rel
        if: steps.due.outputs.kind == 'reel'
        env:
          DUE_FILE: ${{ steps.due.outputs.file }}
        run: |
          F="$DUE_FILE"
          ID=$(node -p "require('./$F').id")
          node render.js "$F"
          cp "out/$ID/cover.png" "out/$ID/$ID-cover.png"
          TAG="ig-$ID"
          gh release view "$TAG" >/dev/null 2>&1 && gh release upload "$TAG" "out/$ID/$ID.mp4" "out/$ID/$ID-cover.png" --clobber \
            || gh release create "$TAG" "out/$ID/$ID.mp4" "out/$ID/$ID-cover.png" --title "IG reel: $ID" --notes "Instagram services reel (auto)."
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Post to Instagram (+ Facebook copy)
        if: steps.due.outputs.kind != 'none'
        env:
          RELEASE_TAG: ${{ steps.rel.outputs.tag }}
        run: node ig.js post "$DATE_IN"

      - name: Save queue state
        if: steps.due.outputs.kind != 'none' && env.DRY_RUN != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A social/ig
          git diff --cached --quiet || git commit -m "Instagram: posted $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done

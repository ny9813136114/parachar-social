name: YouTube settings

# Run one-off YouTube API calls from a file in seo/ (playlist descriptions, channel settings, language fixes).
# Replies are saved to seo/replies/ so they can be checked.

on:
  workflow_dispatch:
    inputs:
      file:
        description: "Calls file, e.g. seo/channel-read.json"
        required: true

permissions:
  contents: write

jobs:
  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
      # Direct YouTube API (yt.js); without these the scripts fall back to the Make webhook.
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Call YouTube
        env:
          CALLS: ${{ inputs.file }}
        run: node api.js "$CALLS"
      - name: Save replies
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seo/replies
          git diff --cached --quiet || { git commit -qm "YouTube API replies" && git pull -q --rebase && git push -q; }

name: Long and mid videos

# Every evening: render tomorrow's 16:9 video from videos/long/<date>-*.json (the Sunday 6-min long video, or a
# 2-3 min mid video on Tue/Thu/Sat), with chapters and tool links in the description, and upload it Private and
# scheduled at the spec's "slot" (IST, default 11:00). Published specs move to videos/long/published/.
# Pause with repo variable AUTO_PUBLISH=off.

on:
  schedule:
    - cron: "30 15 * * *" # 21:00 IST, prepares tomorrow
    - cron: "30 18 * * *" # 00:00 IST backup
  workflow_dispatch:
    inputs:
      file:
        description: "Spec to render (default: the one dated tomorrow)"
        default: ""
      private_only:
        description: "Test: upload as Private with no publish time"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: weekly-long

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
      # Direct YouTube API (yt.js); without these the scripts fall back to the Make webhook.
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      IN_FILE: ${{ github.event.inputs.file }}
      PRIVATE_ONLY: ${{ github.event.inputs.private_only || 'false' }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      MUSIC: "on"
      TTS_ENGINE: edge
      TTS_VOICE: hi-IN-MadhurNeural
      TTS_RATE: "+5%"
    steps:
      - uses: actions/checkout@v4

      - name: Pick the spec
        id: pick
        run: |
          if { [ -z "$MAKE_WEBHOOK_URL" ] && [ -z "$YT_REFRESH_TOKEN" ]; } || [ "${{ vars.AUTO_PUBLISH }}" = "off" ]; then echo "file=" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Target day = IST now + 9 h, as in daily-youtube: the 21:00 run prepares tomorrow, the midnight backup today.
          DATE=$(TZ=Asia/Kolkata date -d '+9 hours' +%F)
          F="${IN_FILE:-$(ls videos/long/"$DATE"-*.json 2>/dev/null | head -n 1)}"
          [ -n "$IN_FILE" ] && DATE="$(basename "$F" | cut -c1-10)"
          echo "file=$F" >> "$GITHUB_OUTPUT"; echo "date=$DATE" >> "$GITHUB_OUTPUT"
          [ -n "$F" ] && echo "slot=$(node -p "require('./$F').slot||'11:00'")" >> "$GITHUB_OUTPUT"
          [ -n "$F" ] && echo "Video for $DATE: $F" || echo "No long or mid video queued for $DATE"

      - uses: actions/setup-node@v4
        if: steps.pick.outputs.file != ''
        with:
          node-version: 22

      - name: Install ffmpeg, Playwright and Chromium
        if: steps.pick.outputs.file != ''
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          python3 -m pip install -q edge-tts

      - name: Render
        if: steps.pick.outputs.file != ''
        # The error goes into an annotation too, so it can be read without the job log.
        run: |
          set +e; node render-long.js "${{ steps.pick.outputs.file }}" 2>&1 | tee render.log; s=${PIPESTATUS[0]}
          [ "$s" = 0 ] || { echo "::error::$(grep 'tts line' render.log | tail -4 | tr '\n' ' ') $(tail -c 600 render.log | tr '\n' ' ')"; exit 1; }

      - name: Keep a release (Make downloads the MP4; the thumbnail is for Studio)
        if: steps.pick.outputs.file != ''
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ID=$(node -p "require('./${{ steps.pick.outputs.file }}').id")
          TAG="long-${{ steps.pick.outputs.date }}-${{ github.run_number }}-${{ github.run_attempt }}"
          cp "out/$ID/thumbnail.png" "out/$ID/$ID-thumbnail.png"
          gh release create "$TAG" "out/$ID/$ID.mp4" "out/$ID/$ID-thumbnail.png" "out/$ID/chapters.txt" --title "Video ${{ steps.pick.outputs.date }}" \
            --notes "Scheduled ${{ steps.pick.outputs.date }} ${{ steps.pick.outputs.slot }} IST. Set the thumbnail in YouTube Studio (file attached)."
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"; echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Upload to YouTube
        if: steps.pick.outputs.file != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.rel.outputs.tag }}
          PUBLISH_SLOTS: ${{ steps.pick.outputs.slot }}
        run: node publish.js "${{ steps.pick.outputs.date }}" "out/${{ steps.rel.outputs.id }}"

      - name: Move the published spec
        if: steps.pick.outputs.file != '' && env.PRIVATE_ONLY != 'true'
        run: |
          mkdir -p videos/long/published
          git mv "${{ steps.pick.outputs.file }}" videos/long/published/
          git add videos/long/published videos/published/youtube.json 2>/dev/null || true
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "Long video published for ${{ steps.pick.outputs.date }}" && git pull -q --rebase origin main && git push

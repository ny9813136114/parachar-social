name: YouTube comments

# Every hour, post the free-tool comment on the Shorts that just went live.
# Pinning it stays manual (the YouTube API can't pin).

on:
  schedule:
    - cron: "*/15 * * * *" # every 15 min: GitHub skips many scheduled runs (19 Oct: none from 10:54 to 15:30 UTC). A run with nothing due costs no Make ops.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-comments

jobs:
  comment:
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to 26 from 19 Oct 2026, Playwright deps may lag
    timeout-minutes: 330 # may wait up to 5 h for the next Short to go live (see comment.js)
    env:
      MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
      # Direct YouTube API (yt.js); without these the scripts fall back to the Make webhook.
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Post comments
        # A queued run may start from an older commit; pull first so a comment is never posted twice.
        run: git pull -q --rebase origin main && node comment.js
        env:
          WAIT_HOURS: "5"
      - name: Post Reels to Instagram and Facebook
        # Free: Meta's Graph API straight from here, no Make ops. Off until the META_TOKEN secret exists,
        # or when the repo variable META_PUBLISH is "off".
        if: vars.META_PUBLISH != 'off'
        continue-on-error: true
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          META_PAGE_ID: ${{ vars.META_PAGE_ID }}
          META_IG_ID: ${{ vars.META_IG_ID }}
        run: node meta.js
      - name: Save which comments are done
        run: |
          [ -f videos/published/youtube.json ] || exit 0
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos/published/youtube.json
          [ -f videos/published/meta.json ] && git add videos/published/meta.json
          git diff --cached --quiet || { git commit -qm "Comments posted" && git pull -q --rebase && git push -q; }

name: Daily YouTube Shorts

# Every evening: take the next day's 3 videos from videos/queue/, render them, and send them to Make,
# which uploads them to YouTube as Private and scheduled for 9:00, 13:00 and 19:30 IST on that day.
# Published specs move to videos/published/. Pause by setting repo variable AUTO_PUBLISH=off.

on:
  schedule:
    # Runs the evening before and schedules the next day's videos, because GitHub often starts scheduled runs
    # hours late (18 Oct: the 06:00 run started at 10:21). Backups find nothing if an earlier run already did it.
    - cron: "30 15 * * *" # 21:00 IST
    - cron: "30 17 * * *" # 23:00 IST backup
    - cron: "30 20 * * *" # 02:00 IST backup
  workflow_dispatch:
    inputs:
      count:
        description: "How many videos from the queue (1-3)"
        default: "3"
      date:
        description: "Publish date YYYY-MM-DD (IST). Empty = today"
        default: ""
      private_only:
        description: "Test: upload as Private with no publish time"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-youtube

jobs:
  publish:
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to 26 from 19 Oct 2026, Playwright deps may lag
    timeout-minutes: 60
    env:
      MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
      # Direct YouTube API (yt.js); without these the scripts fall back to the Make webhook.
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      IN_COUNT: ${{ github.event.inputs.count }}
      # Plan from 26 Oct: 1-2 Shorts on Short days (09:00, 19:30 IST); the 2-3 min videos go out on the other days (weekly-long.yml).
      PUBLISH_SLOTS: "09:00,19:30"
      IN_DATE: ${{ github.event.inputs.date }}
      PRIVATE_ONLY: ${{ github.event.inputs.private_only || 'false' }}
      # Look and sound: v3 engine (a different look per video over real Pexels footage), Hindi voice (Madhur), music.
      ENGINE_STYLE: v3
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      MUSIC: "on"
      TTS_ENGINE: edge
      TTS_VOICE: hi-IN-MadhurNeural
    steps:
      - uses: actions/checkout@v4

      - name: Pick videos from the queue
        id: pick
        run: |
          if [ -z "$MAKE_WEBHOOK_URL" ] || [ "${{ vars.AUTO_PUBLISH }}" = "off" ]; then
            echo "Auto-publish is not set up or is paused; nothing to do."; echo "files=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          N="${IN_COUNT:-2}"; case "$N" in [1-3]) ;; *) N=2;; esac
          # Target day = IST now + 9 h: an evening run (21:00-23:59) prepares tomorrow, a run after midnight
          # or in the morning prepares today. Past slots move to now + 15 min (publish.js).
          DATE="${IN_DATE:-$(TZ=Asia/Kolkata date -d '+9 hours' +%F)}"; [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "bad date"; exit 1; }
          # Only that day's specs (file names start with the date), so a second run on the same day uploads nothing twice.
          FILES=$(ls videos/queue/"$DATE"-*.json 2>/dev/null | sort | head -n "$N" | tr '\n' ' ')
          echo "files=$FILES" >> "$GITHUB_OUTPUT"; echo "date=$DATE" >> "$GITHUB_OUTPUT"
          [ -n "$FILES" ] && echo "Publishing on $DATE: $FILES" || echo "::warning::No queued videos for $DATE (already published, or the queue is empty)"

      - uses: actions/setup-node@v4
        if: steps.pick.outputs.files != ''
        with:
          node-version: 22

      - name: Install ffmpeg, Playwright and Chromium
        if: steps.pick.outputs.files != ''
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          python3 -m pip install -q edge-tts

      - name: Render
        if: steps.pick.outputs.files != ''
        # If the voice service fails, the video still goes out with music only.
        run: for f in ${{ steps.pick.outputs.files }}; do node render.js "$f" || { echo "::warning::voice failed for $f, rendering without voice"; TTS_ENGINE=off node render.js "$f"; }; done

      - name: Keep a release (Make downloads the MP4 from here)
        if: steps.pick.outputs.files != ''
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="yt-${{ steps.pick.outputs.date }}-${{ github.run_number }}-${{ github.run_attempt }}"
          ASSETS=""
          for d in out/*/; do id=$(basename "$d"); cp "$d/captions.srt" "$d/$id.srt"; ASSETS="$ASSETS $d/$id.mp4 $d/$id.srt"; done
          gh release create "$TAG" $ASSETS --title "YouTube ${{ steps.pick.outputs.date }}" \
            --notes "Scheduled 09:00 / 13:00 / 19:30 IST. Pin the free-tool comment on each Short."
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Send to Make (YouTube upload)
        if: steps.pick.outputs.files != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.rel.outputs.tag }}
        run: |
          DIRS=$(for f in ${{ steps.pick.outputs.files }}; do echo "out/$(node -p "require('./$f').id")"; done)
          node publish.js "${{ steps.pick.outputs.date }}" $DIRS

      - name: Move published specs out of the queue
        if: steps.pick.outputs.files != '' && env.PRIVATE_ONLY != 'true'
        run: |
          mkdir -p videos/published
          for f in ${{ steps.pick.outputs.files }}; do git mv "$f" videos/published/; done
          git add videos/published
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "Published to YouTube on ${{ steps.pick.outputs.date }}" && git pull -q --rebase origin main && git push # main may have moved during the render

name: Meta test

# Manual check of the Instagram/Facebook setup: "ids" prints the Page and Instagram ids the token sees,
# "test" posts one already-live Short (spec id) to both right away and records it in meta.json.

on:
  workflow_dispatch:
    inputs:
      cmd:
        description: "ids, test or check"
        default: ids
      id:
        description: "spec id for test"
        default: ""

permissions:
  contents: write

concurrency:
  group: youtube-comments # shares meta.json with the comment job

jobs:
  meta:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run meta.js
        run: node meta.js "${{ inputs.cmd }}" "${{ inputs.id }}" 2>&1 | tee seo/replies/meta-test.txt; exit ${PIPESTATUS[0]}
        shell: bash # the run log is not readable from Claude's cloud, so the output is committed (ids only, never the token)
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          META_PAGE_ID: ${{ vars.META_PAGE_ID }}
          META_IG_ID: ${{ vars.META_IG_ID }}
      - name: Save meta.json
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add seo/replies/meta-test.txt; [ -f videos/published/meta.json ] && git add videos/published/meta.json
          git diff --cached --quiet || { git commit -qm "Meta test post" && git pull -q --rebase && git push -q; }
